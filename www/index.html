<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EKG Kardiyolog Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; overscroll-behavior-y: contain; }
        canvas { background-color: #1e293b; background-image: linear-gradient(#334155 1px, transparent 1px), linear-gradient(90deg, #334155 1px, transparent 1px); background-size: 20px 20px; }
    </style>
</head>
<body class="flex flex-col h-screen p-4">
    <header class="mb-4 text-center">
        <h1 class="text-2xl font-bold text-blue-400">EKG Kardiyolog Pro</h1>
        <p class="text-sm text-gray-400">Yapay Zeka & Simülasyon</p>
    </header>
    
    <div class="flex-grow flex flex-col justify-center items-center">
        <canvas id="ekgCanvas" class="w-full h-64 rounded-lg shadow-lg border border-gray-600 mb-4"></canvas>
        
        <div class="w-full bg-slate-800 p-4 rounded-lg shadow">
            <label class="block text-sm font-medium mb-2">BPM (Kalp Atış Hızı): <span id="bpmValue">75</span></label>
            <input type="range" id="bpmSlider" min="40" max="200" value="75" class="w-full h-2 bg-blue-600 rounded-lg appearance-none cursor-pointer">
        </div>
    </div>

    <script>
        const canvas = document.getElementById('ekgCanvas');
        const ctx = canvas.getContext('2d');
        const bpmSlider = document.getElementById('bpmSlider');
        const bpmValue = document.getElementById('bpmValue');
        
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight || 256;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let t = 0;
        function drawEKG() {
            let bpm = bpmSlider.value;
            bpmValue.innerText = bpm;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.strokeStyle = '#22c55e'; // Yeşil EKG çizgisi
            ctx.lineWidth = 2;
            
            let yCenter = canvas.height / 2;
            let period = 60 / bpm;
            
            for (let x = 0; x < canvas.width; x++) {
                let time = (x + t) * 0.01;
                let phase = time % period;
                
                let y = yCenter;
                // Basit PQRST simülasyonu
                if (phase > 0.1 && phase < 0.2) y -= 10 * Math.sin((phase - 0.1) * Math.PI * 10); // P
                else if (phase > 0.25 && phase < 0.28) y += 5; // Q
                else if (phase >= 0.28 && phase < 0.32) y -= 60 * Math.sin((phase - 0.28) * Math.PI * 25); // R
                else if (phase >= 0.32 && phase < 0.35) y += 15; // S
                else if (phase > 0.5 && phase < 0.7) y -= 15 * Math.sin((phase - 0.5) * Math.PI * 5); // T
                
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            t += 2;
            requestAnimationFrame(drawEKG);
        }
        drawEKG();
    </script>
</body>
</html>
